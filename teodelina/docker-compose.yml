services:
  # -----------------------------------------
  # 1. LA BASE DE DATOS (MySQL)
  # -----------------------------------------
  db:
    image: mysql:8.0
    container_name: teodelina_mysql
    restart: always 
    environment:
      MYSQL_DATABASE: teodelina
      MYSQL_ROOT_PASSWORD: root # 👈 Lo unificamos a "root"
    ports:
      - "3306:3306" 
    volumes:
      - db_data:/var/lib/mysql 

  # -----------------------------------------
  # 2. EL BACKEND (Java Spring Boot)
  # -----------------------------------------
  api:
    build: 
      context: ./teodelina 
    container_name: teodelina_backend
    restart: always
    ports:
      - "8080:8080" 
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/teodelina?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root # 👈 Ahora coincide perfecto con la DB
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - db 

  # -----------------------------------------
  # 3. EL FRONTEND (React + Nginx)
  # -----------------------------------------
  web:
    build: 
      context: ./frontend-teodelina 
    container_name: teodelina_frontend
    restart: always
    ports:
      - "80:80" 
    depends_on:
      - api 

volumes:
  db_data: